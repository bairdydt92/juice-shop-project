      uses: semgrep/semgrep-action@v1
        with:
          config: p/owasp-top-ten   # a solid general-purpose ruleset to start with

  # ---------- DAST: needs Juice Shop actually running to attack it ----------
  zap-scan:
    name: OWASP ZAP Baseline (DAST)
    runs-on: ubuntu-latest

    services:
      juice-shop:
        image: bkimminich/juice-shop
        ports:
          - 3000:3000

    steps:
      - uses: actions/checkout@v4

      # Give Juice Shop a moment to fully start before ZAP hits it
      - name: Wait for Juice Shop to be ready
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:3000 && break
            echo "Waiting for Juice Shop..."
            sleep 2
          done

      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          # Baseline scan is passive/light-touch — safe default for a first pass.
          # docs: https://www.zaproxy.org/docs/docker/baseline-scan/
          cmd_options: '-a'   # include alpha-quality passive rules too

      # ZAP writes a report file - this makes it downloadable from the
      # Actions run summary instead of only visible in the logs
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html
