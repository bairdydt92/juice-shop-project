name: Security Scan

# Runs on every push to main, and lets you trigger it manually from the Actions tab
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ---------- SAST: scans the source code, no app needs to be running ----------
  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep   # official image, always current -- avoids version-mismatch crashes
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        run: semgrep scan --config p/owasp-top-ten --output semgrep-results.txt
        continue-on-error: true   # so findings don't fail the whole job -- we're reviewing, not gating yet

      - name: Show results in log
        run: cat semgrep-results.txt

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-results.txt

  # ---------- DAST: needs Juice Shop actually running to attack it ----------
  zap-scan:
    name: OWASP ZAP Baseline (DAST)
    runs-on: ubuntu-latest

    services:
      juice-shop:
        image: bkimminich/juice-shop
        ports:
          - 3000:3000

    steps:
      - uses: actions/checkout@v4

      # Give Juice Shop a moment to fully start before ZAP hits it
      - name: Wait for Juice Shop to be ready
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:3000 && break
            echo "Waiting for Juice Shop..."
            sleep 2
          done

      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          # Baseline scan is passive/light-touch — safe default for a first pass.
          # docs: https://www.zaproxy.org/docs/docker/baseline-scan/
          cmd_options: '-a'   # include alpha-quality passive rules too

      # ZAP writes a report file - this makes it downloadable from the
      # Actions run summary instead of only visible in the logs
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html
